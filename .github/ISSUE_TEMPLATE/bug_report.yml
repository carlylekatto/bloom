name: Bug report
description: Something in Bloom isn't working as expected
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: bloom-version
    attributes:
      label: Bloom version
      description: "Settings → About (e.g. 3.8.6)"
      placeholder: "3.8.6"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: "Win+R → `winver` (e.g. Windows 11 24H2, build 26100)"
      placeholder: "Windows 11 24H2, build 26100"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which part of Bloom?
      options:
        - Dock
        - Notch
        - Media controls / now playing
        - Overlays
        - Settings
        - Installer / updater / startup
        - Other
    validations:
      required: true

  - type: input
    id: monitors
    attributes:
      label: Number of monitors
      description: How many displays are connected, including any second screen.
      placeholder: "1"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Bloom
        2. Hover over the dock...
        3. See error
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Optional, but it usually answers the question faster than a back-and-forth. In Bloom go to Settings → About → Copy Diagnostics, then paste it here. It contains your Windows build, monitor layout, and shell state — no file paths, no app names, and nothing is sent anywhere.
      placeholder: |
        {
          "os": { "display_version": "26H2", "current_build": "26300", "ubr": "9457" },
          "monitors": [ { "primary": true, "width": 2560, "scale_factor": 1.25 } ],
          "shell": { "shell_traywnd_found": true },
          "marker": { "present": false }
        }
    validations:
      required: false

  - type: textarea
    id: media
    attributes:
      label: Screenshots or recordings
      description: Drag and drop files here. Visual bugs are much easier to fix with a recording.
    validations:
      required: false
